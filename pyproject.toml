[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "isvd"
version = "1.0.0"
description = "Incremental truncated SVD with row/column appends, rank-1 updates, refresh policies and an a posteriori error bound"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Stilyan Staykov" }]
dependencies = ["numpy"]

[project.optional-dependencies]
experiments = ["pandas", "matplotlib"]
data = ["yfinance"]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "experiments", "tests"]
